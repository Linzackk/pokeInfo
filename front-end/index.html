<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokemonAPI</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="tela">
        <div id="cartaoPokemon">
            <div class="info identificadores">
                <b><span id="numDex"></span></b>
                <b><span id="nome"></span></b>
            </div>
            <div class="info"><img src="#" alt="" id="imagem"></div>
            <div id="tipos" class="info tipos">
            </div>
            <div class="info medidas">
                <div class="peso">
                    <span id="tagPeso"></span>
                    <span id="peso"></span>
                </div>             
                
                <div class="altura">
                    <span id="tagAltura"></span>
                    <span id="altura"></span>
                </div>
            </div>
        </div>
        <div id="busca">
            <form action="" id="formPokemon">
                <input 
                    type="text" 
                    placeholder="Número do Pokémon" 
                    id="inputNumero"
                >
            </form>
        </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
</body>
</html>
